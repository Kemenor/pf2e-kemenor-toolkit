name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 - <<PY
          import json, os
          m = json.load(open("module.json"))
          m["version"] = "${VERSION}"
          m["manifest"] = "${BASE}/module.json"
          m["download"] = "${BASE}/module.zip"
          json.dump(m, open("module.json", "w"), indent=2)
          PY

      - name: Build zip
        run: zip -r module.zip module.json README.md LICENSE scripts lang

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
